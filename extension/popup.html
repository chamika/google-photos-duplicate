<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup">
    <h1>Photos Duplicate Deleter</h1>

    <div id="not-on-photos" class="warning" style="display:none;">
      Please open <a href="https://photos.google.com" target="_blank">photos.google.com</a> first.
    </div>

    <div id="main-content">
      <div id="load-section">
        <p>Load the <code>duplicates.json</code> file generated by the scanner.</p>
        <label class="file-btn">
          Choose File
          <input type="file" id="file-input" accept=".json" hidden>
        </label>
        <span id="file-name" class="file-name"></span>
      </div>

      <div id="summary-section" style="display:none;">
        <div class="stats-grid">
          <div class="stat">
            <span class="stat-value" id="stat-groups">0</span>
            <span class="stat-label">Duplicate Groups</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-delete">0</span>
            <span class="stat-label">Photos to Delete</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-space">0</span>
            <span class="stat-label">MB Recoverable</span>
          </div>
        </div>

        <div class="controls">
          <div class="delay-control">
            <label for="delay-input">Delay between deletions (sec):</label>
            <input type="number" id="delay-input" value="3" min="1" max="30" step="0.5">
          </div>
          <button id="start-btn" class="btn btn-primary">Start Deletion</button>
          <button id="pause-btn" class="btn btn-warning" style="display:none;">Pause</button>
          <button id="resume-btn" class="btn btn-primary" style="display:none;">Resume</button>
          <button id="stop-btn" class="btn btn-danger" style="display:none;">Stop</button>
        </div>
      </div>

      <div id="progress-section" style="display:none;">
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="progress-text" id="progress-text">0 / 0</p>
      </div>

      <div id="log-section" style="display:none;">
        <h3>Log</h3>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
